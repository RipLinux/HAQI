services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-haqi}
      POSTGRES_USER: ${POSTGRES_USER:-haqi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haqi_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: sqlite:////mlflow/mlflow.db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    volumes: [mlflow_data:/mlflow]
    ports: ["5000:5000"]
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-haqi}:${POSTGRES_PASSWORD:-haqi_dev_password}@postgres:5432/${POSTGRES_DB:-haqi}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${FRONTEND_API_URL:-http://localhost:8000/api/v1}
    ports: ["5173:5173"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  postgres_data:
  mlflow_data:
